name: Publish Herobrine AI v1.0.0

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'DEVILmihirYT/Herobrine'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.1"

      - name: Build mod
        run: gradle build --no-daemon

      - name: Publish v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "v1.0.0 already exists; nothing to do."
            exit 0
          fi

          gh release create v1.0.0 build/libs/*.jar \
            --repo "${{ github.repository }}" \
            --target main \
            --title "Herobrine AI v1.0.0" \
            --notes "AI-driven Herobrine experience for Minecraft Java Edition 26.1 using Fabric.

Included:
- 3-stage Herobrine progression
- AI-driven contextual behavior
- Gemini to Groq fallback chain
- Natural English, Hindi and Hinglish dialogue
- Persistent AI memories and player relationships
- Stage 3 grudge and delayed-revenge system
- ElevenLabs voice output
- Custom Herobrine rendering and stage textures
- Herobrine Castle progression
- Dark Frame / Dark Portal endgame
- 10-second Doomsday sequence
- Mashaal system

Requirements:
- Minecraft Java Edition 26.1
- Fabric Loader 0.19.5
- Fabric API for Minecraft 26.1
- Java 25

Runtime API keys are required for AI and voice features and are not bundled in the JAR."
