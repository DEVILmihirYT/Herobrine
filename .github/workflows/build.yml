name: Build Herobrine AI

on:
  push:
    branches: ["main", "release/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.1"

      - name: Build mod
        run: gradle build --no-daemon

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: herobrineai-build
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Optional AI provider smoke test
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_CHAT_API_KEY: ${{ secrets.GEMINI_CHAT_API_KEY }}
        run: |
          set -u
          failed=0

          if [ -n "${GROQ_API_KEY:-}" ]; then
            groq_body=$(mktemp)
            groq_status=$(curl -sS -o "$groq_body" -w "%{http_code}" \
              -H "Authorization: Bearer $GROQ_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"model":"openai/gpt-oss-20b","messages":[{"role":"user","content":"Return exactly JSON with ok true."}],"response_format":{"type":"json_schema","json_schema":{"name":"smoke","strict":true,"schema":{"type":"object","properties":{"ok":{"type":"boolean"}},"required":["ok"],"additionalProperties":false}}},"include_reasoning":false,"max_completion_tokens":128}' \
              https://api.groq.com/openai/v1/chat/completions)
            echo "Groq smoke HTTP status: $groq_status"
            if [ "$groq_status" != "200" ]; then
              echo "Groq smoke error:"
              grep -o '"message"[^,}]*' "$groq_body" | head -1 || true
              failed=1
            fi
            rm -f "$groq_body"
          fi

          if [ -n "${GEMINI_CHAT_API_KEY:-}" ]; then
            gemini_body=$(mktemp)
            gemini_status=$(curl -sS -o "$gemini_body" -w "%{http_code}" \
              -H "x-goog-api-key: $GEMINI_CHAT_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"contents":[{"parts":[{"text":"Return exactly JSON with ok true."}]}],"generationConfig":{"responseMimeType":"application/json"}}' \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent")
            echo "Gemini smoke HTTP status: $gemini_status"
            if [ "$gemini_status" != "200" ]; then
              echo "Gemini smoke error:"
              grep -o '"message"[^,}]*' "$gemini_body" | head -1 || true
              case "$gemini_status" in
                429|500|502|503|504)
                  echo "::warning::Gemini smoke test is temporarily unavailable ($gemini_status); build remains valid."
                  ;;
                *)
                  failed=1
                  ;;
              esac
            fi
            rm -f "$gemini_body"
          fi

          exit "$failed"

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/heads/release/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 build/libs/*.jar \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Herobrine AI v1.0.0" \
            --notes-file <(cat <<'EOF'
# Herobrine AI v1.0.0

AI-driven Herobrine experience for Minecraft Java Edition 26.1 using Fabric.

## Included
- 3-stage Herobrine progression
- AI-driven contextual behavior
- Gemini → Groq fallback chain
- Natural English, Hindi and Hinglish dialogue
- Persistent AI memories and player relationships
- Stage 3 grudge and delayed-revenge system
- ElevenLabs voice output
- Custom Herobrine rendering and stage textures
- Herobrine Castle progression
- Dark Frame / Dark Portal endgame
- 10-second Doomsday sequence
- Mashaal system

## Requirements
- Minecraft Java Edition 26.1
- Fabric Loader 0.19.5
- Fabric API for Minecraft 26.1
- Java 25

## AI / Voice
Runtime API keys are required for AI and voice features. API keys are not bundled in the JAR.

The JAR attached to this release is built directly from this release commit.
EOF
)
